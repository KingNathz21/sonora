<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>SONORA</title>
<style>
:root{--bg:#101114;--panel:#19181d;--line:#302d35;--txt:#f5f3f7;--muted:#97919e;--accent:#b79aff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px Inter,system-ui,sans-serif}.layout{display:grid;grid-template-columns:225px 1fr;min-height:100vh;padding-bottom:96px}.side{background:#151419;border-right:1px solid #252329;padding:25px 14px;display:flex;flex-direction:column}.brand{font-size:27px;font-weight:800;letter-spacing:-1.5px;margin:0 10px 35px;display:flex;align-items:center;gap:12px}.wave{display:flex;gap:3px;align-items:center}.wave i{width:4px;border-radius:4px;background:var(--accent)}.wave i:nth-child(1){height:10px}.wave i:nth-child(2){height:20px}.wave i:nth-child(3){height:28px}.wave i:nth-child(4){height:17px}.wave i:nth-child(5){height:8px}.label{font-size:10px;letter-spacing:1.5px;color:#777;padding:0 10px 9px}.nav button{display:block;width:100%;text-align:left;background:none;color:#aaa;padding:11px;border:0;border-radius:8px;cursor:pointer}.nav button:hover,.nav button.on{background:#26232c;color:#fff}.nav button.on{color:var(--accent)}main{min-width:0;background:radial-gradient(ellipse at 20% 0,#292235,transparent 35%),var(--bg)}header{height:68px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0;background:#101114dd;backdrop-filter:blur(12px);z-index:2}.pill{border:0;background:var(--accent);color:#21172d;padding:10px 16px;border-radius:20px;font-weight:700;cursor:pointer}.content{padding:26px 30px 50px;max-width:1400px;margin:auto}.hero{background:linear-gradient(120deg,#292233,#19171d);border:1px solid #3a3242;border-radius:18px;padding:30px;margin-bottom:28px}.eyebrow{color:var(--accent);letter-spacing:1.5px;font-size:10px;font-weight:700}.hero h1{font-size:42px;line-height:1.05;letter-spacing:-2px;margin:12px 0}.hero p{color:var(--muted)}h2{font-size:17px;margin:24px 0 14px}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:12px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}.card{background:#1b191f;padding:12px;border:1px solid #27242b;border-radius:12px;cursor:pointer}.art{aspect-ratio:1;background:linear-gradient(135deg,#4b3b5c,#242128);border-radius:8px;display:grid;place-items:center;color:#c5aaff;font-size:32px;overflow:hidden}.card b{display:block;margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card small{color:var(--muted)}.table{border:1px solid #29262e;border-radius:12px;overflow:hidden}.track{display:grid;grid-template-columns:34px minmax(0,1fr) 90px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #242228;cursor:pointer}.track:last-child{border:0}.track:hover{background:#211f25}.track .art{width:36px;height:36px;font-size:14px}.track .name{display:flex;align-items:center;gap:10px;min-width:0}.track .name div:last-child{min-width:0}.track b,.track small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track small{color:var(--muted);margin-top:3px}.track button{background:none;border:0;color:#aaa;font-size:17px}.empty{padding:40px;text-align:center;border:1px dashed #39343e;border-radius:12px;color:var(--muted)}.search{width:100%;background:#211f25;border:1px solid #39343e;color:white;padding:14px;border-radius:10px;margin:10px 0 20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;background:#1c1a20;border:1px solid var(--line);border-radius:12px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:8px}.player{position:fixed;bottom:0;left:0;right:0;height:96px;background:#17161a;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:0 18px;z-index:4}.playing{display:flex;gap:10px;align-items:center;min-width:0}.playing .art{width:48px;height:48px;flex-shrink:0}.playing b,.playing small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playing small{color:var(--muted);margin-top:4px}.controls{text-align:center}.controls button{background:none;border:0;color:#aaa;font-size:18px;cursor:pointer;margin:0 7px}.controls .play{background:#f5f3f7;color:#111;border-radius:50%;width:34px;height:34px}.seek{display:flex;align-items:center;gap:8px;margin-top:8px;color:#777;font-size:10px}.seek input{flex:1;accent-color:var(--accent)}.volume{display:flex;justify-content:flex-end;align-items:center;gap:10px}.volume input{max-width:100px;accent-color:var(--accent)}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:5}.box{background:#211f25;border:1px solid #3a3540;padding:22px;border-radius:14px;width:min(420px,90vw)}.box input{width:100%;margin:8px 0;padding:11px;background:#151419;border:1px solid #39343e;border-radius:8px;color:white}.box button{margin-top:10px;padding:10px 15px;border:0;border-radius:8px;cursor:pointer}.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#29252f;padding:10px 15px;border-radius:9px;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:700px){.layout{grid-template-columns:60px 1fr}.side{padding:15px 7px}.brand{justify-content:center;margin:0 0 22px}.brand>span:last-child,.label{display:none}.nav button{text-align:center;padding:12px 3px;font-size:0}.nav button:before{content:attr(data-icon);font-size:18px}.content{padding:16px}.hero{padding:20px}.hero h1{font-size:32px}.cards{grid-template-columns:repeat(2,1fr)}.player{height:84px;grid-template-columns:1fr 1fr;padding:0 8px}.playing .art{width:38px;height:38px}.playing b{font-size:11px}.playing small{font-size:10px}.controls button{margin:0 3px;font-size:14px}.seek{gap:4px}.volume{display:none}}
</style><style>
#sonora-auth-gate{position:fixed;inset:0;z-index:9999;background:#101114;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;color:#f5f3f7}
#sonora-auth-gate .auth-card{width:min(420px,100%);background:#19181d;border:1px solid #302d35;border-radius:20px;padding:32px;text-align:center}
#sonora-auth-gate h1{margin:12px 0;font-size:32px;letter-spacing:-1px}
#sonora-auth-gate p{color:#97919e;line-height:1.6}
#sonora-auth-gate button{border:0;border-radius:24px;background:#b79aff;color:#21172d;font-weight:700;padding:12px 18px;cursor:pointer}
#sonora-auth-gate #auth-message{font-size:13px;margin-top:14px}
#sonora-auth-gate .wave{display:inline-flex;gap:3px;align-items:center}
#sonora-auth-gate .wave i{width:4px;border-radius:4px;background:#b79aff}
#sonora-auth-gate .wave i:nth-child(1){height:10px}#sonora-auth-gate .wave i:nth-child(2){height:20px}#sonora-auth-gate .wave i:nth-child(3){height:28px}#sonora-auth-gate .wave i:nth-child(4){height:17px}#sonora-auth-gate .wave i:nth-child(5){height:8px}
body:not(.sonora-authorised) .layout,body:not(.sonora-authorised) .player,body:not(.sonora-authorised) #files,body:not(.sonora-authorised) .toast{display:none!important}
</style>
<div id="sonora-auth-gate"><div class="auth-card"><div class="wave"><i></i><i></i><i></i><i></i><i></i></div><h1>sonora</h1><p>Your music. Your world.</p><p>Sign in to access your private music player.</p><button id="sonora-login">Continue with Google</button><div id="auth-message"></div></div></div>
<script src="firebase-config.js"></script><script type="module" src="auth.js"></script></head><body>
<div class="layout"><aside class="side"><div class="brand"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span>sonora</span></div><div class="label">MENU</div><nav class="nav"><button class="on" data-page="home" data-icon="⌂">Home</button><button data-page="search" data-icon="⌕">Search</button><button data-page="library" data-icon="▤">Your Library</button><button data-page="artists" data-icon="♬">Artists</button><button data-page="stats" data-icon="✦">Wrapped & Stats</button></nav><div style="margin-top:auto"><div class="label">LOCAL LIBRARY</div><button class="pill" id="sideUpload">＋ Add music</button></div></aside>
<main><header><span class="muted">Your music. Your world.</span><button class="pill" id="upload">＋ Add music</button></header><section class="content" id="content"></section></main></div>
<footer class="player"><div class="playing"><div class="art" id="nowArt">♫</div><div style="min-width:0"><b id="nowTitle">Nothing playing</b><small id="nowArtist">Choose a song to begin</small></div></div><div class="controls"><div><button id="shuffle" title="Shuffle">⤨</button><button id="prev">⏮</button><button id="play" class="play">▶</button><button id="next">⏭</button><button id="repeat">↻</button></div><div class="seek"><span id="elapsed">0:00</span><input id="progress" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div></div><div class="volume">◖ <input id="volume" type="range" min="0" max="1" step=".01" value=".8"></div></footer>
<input id="files" type="file" accept="audio/*" multiple hidden><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),dbName='sonora-audio';let db,tracks=[],history=[],current=null,shuffle=false,repeat=0,page='home';const audio=new Audio();
const openDB=()=>new Promise((ok,no)=>{let r=indexedDB.open(dbName,1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const put=record=>new Promise(ok=>{let t=db.transaction('files','readwrite');t.objectStore('files').put(record);t.oncomplete=ok});
const get=id=>new Promise(ok=>{let r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>ok(r.result)});
const save=()=>localStorage.setItem('sonora-meta',JSON.stringify({tracks:tracks.map(({blob,...s})=>s),history}));
const load=()=>{let x=JSON.parse(localStorage.getItem('sonora-meta')||'{}');tracks=x.tracks||[];history=x.history||[]};
const time=n=>isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{let t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)};
function art(s){return s?.art?'<img src="'+s.art+'" style="width:100%;height:100%;object-fit:cover">':'♫'}
function row(s,i){return '<div class="track" data-id="'+s.id+'"><div>'+ (i+1)+'</div><div class="name"><div class="art">'+art(s)+'</div><div><b>'+esc(s.title)+'</b><small>'+esc(s.artist||'Unknown artist')+'</small></div></div><button data-fav="'+s.id+'">'+(s.fav?'♥':'♡')+'</button></div>'}
function card(s){return '<div class="card" data-id="'+s.id+'"><div class="art">'+art(s)+'</div><b>'+esc(s.title)+'</b><small>'+esc(s.artist||'Unknown artist')+'</small></div>'}
function list(arr){return arr.length?'<div class="table">'+arr.map(row).join('')+'</div>':'<div class="empty">No music here yet. Add audio files to start your collection.</div>'}
function render(){let c=$('#content');if(page==='home'){let rec=history.slice(0,5).map(h=>tracks.find(s=>s.id===h.id)).filter(Boolean);c.innerHTML='<section class="hero"><div class="eyebrow">PERSONAL MUSIC SPACE</div><h1>Your music.<br>Your world.</h1><p>Every song you love, all in one place.</p><button class="pill" id="heroUpload">＋ Add music to your library</button></section><h2>Recently played</h2>'+list(rec)+'<h2>Recently added</h2><div class="cards">'+tracks.slice(0,6).map(card).join('')+'</div>'}else if(page==='library'){c.innerHTML='<div class="eyebrow">COLLECTION</div><h1>Your Library</h1><p class="muted">'+tracks.length+' songs</p>'+list(tracks)}else if(page==='search'){c.innerHTML='<h1>Search</h1><input class="search" id="search" placeholder="Songs, artists, albums..."><div id="results"></div>';$('#search').oninput=e=>{let q=e.target.value.toLowerCase();$('#results').innerHTML=list(tracks.filter(s=>(s.title+' '+s.artist+' '+s.album).toLowerCase().includes(q)));bind()}}else if(page==='artists'){let a=[...new Set(tracks.map(s=>s.artist).filter(Boolean))];c.innerHTML='<h1>Artists</h1><div class="cards">'+a.map(n=>'<div class="card" data-artist="'+esc(n)+'"><div class="art">♬</div><b>'+esc(n)+'</b><small>'+tracks.filter(s=>s.artist===n).length+' tracks</small></div>').join('')+'</div>'}else{let mins=history.reduce((n,h)=>n+(h.seconds||0),0);let plays={};history.forEach(h=>plays[h.id]=(plays[h.id]||0)+1);let top=Object.entries(plays).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id])=>tracks.find(s=>s.id===id)).filter(Boolean);c.innerHTML='<div class="eyebrow">YOUR LISTENING</div><h1>Wrapped & Stats</h1><div class="stats"><div class="stat"><small>Minutes listened</small><strong>'+Math.round(mins/60*10)/10+' hrs</strong></div><div class="stat"><small>Recorded plays</small><strong>'+history.length+'</strong></div><div class="stat"><small>Library</small><strong>'+tracks.length+' songs</strong></div></div><h2>Top tracks</h2>'+list(top)}bind()}
function bind(){document.querySelectorAll('[data-id]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-fav]'))return;play(el.dataset.id)});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();let s=tracks.find(x=>x.id===b.dataset.fav);s.fav=!s.fav;save();render()});document.querySelectorAll('[data-artist]').forEach(el=>el.onclick=()=>{page='library';render();let a=el.dataset.artist;$('#content').innerHTML='<h1>'+esc(a)+'</h1>'+list(tracks.filter(s=>s.artist===a));bind()});$('#heroUpload')?.addEventListener('click',upload)}
function upload(){$('#files').click()}
$('#upload').onclick=upload;$('#sideUpload').onclick=upload;$('#files').onchange=async e=>{for(const f of e.target.files){if(!f.type.startsWith('audio/'))continue;let s={id:crypto.randomUUID(),title:f.name.replace(/\.[^.]+$/,''),artist:'',album:'',fileName:f.name,added:Date.now(),fav:false};await put({...s,blob:f});tracks.unshift(s)}save();render();toast('Music added to this browser')};
async function play(id){let s=tracks.find(x=>x.id===id),record=await get(id);if(!record)return;current=s;audio.src=URL.createObjectURL(record.blob);audio.play();history.unshift({id,at:Date.now(),seconds:0});history=history.slice(0,4000);save();update();render()}
function update(){$('#nowTitle').textContent=current?.title||'Nothing playing';$('#nowArtist').textContent=current?.artist||'Choose a song to begin';$('#nowArt').innerHTML=art(current);$('#play').textContent=audio.paused?'▶':'Ⅱ'}
function next(){if(!tracks.length)return;let i=tracks.findIndex(s=>s.id===current?.id);play(tracks[shuffle?Math.floor(Math.random()*tracks.length):(i+1)%tracks.length].id)}
audio.onplay=update;audio.onpause=update;audio.onended=()=>repeat===2?(audio.currentTime=0,audio.play()):next();audio.ontimeupdate=()=>{$('#elapsed').textContent=time(audio.currentTime);$('#duration').textContent=time(audio.duration);if(audio.duration)$('#progress').value=audio.currentTime/audio.duration*1000;if(history[0]?.id===current?.id)history[0].seconds=Math.floor(audio.currentTime);save()};
$('#play').onclick=()=>current?(audio.paused?audio.play():audio.pause()):tracks.length&&play(tracks[0].id);$('#next').onclick=next;$('#prev').onclick=()=>{if(audio.currentTime>3)audio.currentTime=0;else next()};$('#shuffle').onclick=()=>{shuffle=!shuffle;$('#shuffle').style.color=shuffle?'var(--accent)':''};$('#repeat').onclick=()=>{repeat=(repeat+1)%3;$('#repeat').style.color=repeat?'var(--accent)':'';$('#repeat').textContent=repeat===2?'↻¹':'↻'};$('#progress').oninput=()=>audio.duration&&(audio.currentTime=audio.duration*$('#progress').value/1000);$('#volume').oninput=()=>audio.volume=$('#volume').value;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x===b));render()});
(async()=>{db=await openDB();load();audio.volume=.8;render()})();
</script></body></html>
