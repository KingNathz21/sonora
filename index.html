/* SONORA visual refresh */
:root{color-scheme:dark;--accent:#ff4545;--accent-soft:#ff45451c}
body{letter-spacing:.01em}
.side{position:sticky;top:0;height:100vh}
.brand{font-size:29px}
.nav{display:grid;gap:5px}
.nav button{display:flex;align-items:center;gap:14px;padding:12px 13px;font-size:13px;font-weight:600;transition:background .18s,color .18s}
.nav button i{width:19px;text-align:center;font-size:16px}
.nav button.on{background:var(--accent-soft);color:#ff6969}
.nav button:hover{background:#29242a}
.pill{background:linear-gradient(135deg,#ff5b5b,#e92f3b);color:#fff;box-shadow:0 5px 18px #ff454526;transition:transform .18s,filter .18s}
.pill:hover{filter:brightness(1.08);transform:translateY(-1px)}
main{min-height:100vh}
header{border-bottom:1px solid #ffffff0a}
.content{padding-top:32px}
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 85% 20%,#ff45452a,transparent 32%),linear-gradient(115deg,#321719,#1b171d 72%);padding:38px}
.hero:after{content:"";position:absolute;width:230px;height:230px;border:1px solid #ff77772b;border-radius:50%;right:7%;top:50%;transform:translateY(-50%);box-shadow:0 0 0 24px #ff454508,0 0 0 48px #ff454506;pointer-events:none}
.hero h1{font-size:clamp(36px,5vw,58px);max-width:600px}
.hero p{font-size:14px}
h1{letter-spacing:-1.4px}
h2{letter-spacing:-.3px}
.card,.stat,.table{box-shadow:0 8px 24px #00000012}
.card{transition:transform .18s,border-color .18s,background .18s}
.card:hover{transform:translateY(-3px);border-color:#694044;background:#211d23}
.art{background:linear-gradient(135deg,#71363a,#25191e);color:#ffb0b0}
.art>i{font-size:30px;filter:drop-shadow(0 4px 8px #0005)}
.track{transition:background .15s}
.track:hover{background:#292329}
.track-actions button,.track button{cursor:pointer;transition:color .15s,transform .15s}
.track-actions button:hover,.track button:hover{color:#ff7777;transform:scale(1.08)}
.player{background:#171519f5;backdrop-filter:blur(18px);box-shadow:0 -8px 30px #0003}
.controls button{cursor:pointer;transition:color .15s,transform .15s}
.controls button:hover{color:#fff;transform:scale(1.1)}
.controls .play{background:var(--accent);color:#fff;box-shadow:0 3px 14px #ff454544}
.controls .play:hover{background:#ff6969}
.search:focus,.library-tools input:focus,.library-tools select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #ff454522}
.empty{background:#ffffff03}
#sonora-auth-gate .auth-card{box-shadow:0 24px 80px #0008}
#sonora-auth-gate .auth-card .wave{margin-bottom:5px}
#sonora-auth-gate button{width:100%;margin-top:10px;background:linear-gradient(135deg,#ff5b5b,#e92f3b);color:#fff}
@media(max-width:700px){
 .layout{grid-template-columns:64px minmax(0,1fr)}
 .side{height:calc(100vh - 84px);position:fixed;top:0;left:0;width:64px;z-index:3;padding:14px 6px}
 .layout main{grid-column:2}
 .brand{margin:0 0 22px}
 .nav{gap:6px}
 .nav button{justify-content:center;padding:13px 4px}
 .nav button span{display:none}
 .nav button i{width:auto;font-size:18px}
 .side .pill{font-size:0;padding:11px;width:42px;height:42px}
 .side .pill i{font-size:16px}
 .content{padding:18px 13px 34px}
 header{padding:0 14px}
 .hero{padding:24px 19px}
 .hero:after{right:-130px;opacity:.5}
 .hero h1{font-size:34px}
 .player{left:0;height:84px;grid-template-columns:minmax(0,1fr) auto;gap:6px}
 .controls button{margin:0 3px}
 .controls .play{width:32px;height:32px}
}
</style><style>

body:not(.sonora-authorised) .layout,body:not(.sonora-authorised) .player,body:not(.sonora-authorised) #files,body:not(.sonora-authorised) .toast{display:none!important}

#sonora-auth-gate .auth-card{text-align:left}
#sonora-auth-gate .auth-card h1,#sonora-auth-gate .auth-card p{text-align:center}

#sonora-auth-gate input{width:100%;padding:13px 14px;border:1px solid #493033;border-radius:10px;background:#101114;color:#f5f3f7;font:inherit;outline:none}

#sonora-auth-gate button:disabled{opacity:.65;cursor:wait}

<div class="layout"><aside class="side"><div class="brand"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span>sonora</span></div><div class="label">MENU</div><nav class="nav"><button class="on" data-page="home"><i class="fa-solid fa-house"></i><span>Home</span></button><button data-page="search"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></button><button data-page="library"><i class="fa-solid fa-music"></i><span>Your Library</span></button><button data-page="artists"><i class="fa-solid fa-microphone"></i><span>Artists</span></button><button data-page="albums"><i class="fa-solid fa-compact-disc"></i><span>Albums</span></button><button data-page="playlists"><i class="fa-solid fa-list"></i><span>Playlists</span></button><button data-page="favourites"><i class="fa-solid fa-heart"></i><span>Favourites</span></button><button data-page="stats"><i class="fa-solid fa-chart-simple"></i><span>Wrapped & Stats</span></button></nav><div style="margin-top:auto"><div class="label">LOCAL LIBRARY</div><button class="pill" id="sideUpload"><i class="fa-solid fa-plus"></i> Add music</button></div></aside>

<footer class="player"><div class="playing"><div class="art" id="nowArt"><i class="fa-solid fa-music"></i></div><div style="min-width:0"><b id="nowTitle">Nothing playing</b><small id="nowArtist">Choose a song to begin</small></div></div><div class="controls"><div><button id="shuffle" title="Shuffle" aria-label="Shuffle"><i class="fa-solid fa-shuffle"></i></button><button id="prev" title="Previous" aria-label="Previous"><i class="fa-solid fa-backward-step"></i></button><button id="play" class="play" aria-label="Play"><i class="fa-solid fa-play"></i></button><button id="next" title="Next" aria-label="Next"><i class="fa-solid fa-forward-step"></i></button><button id="repeat" title="Repeat" aria-label="Repeat"><i class="fa-solid fa-repeat"></i></button></div><div class="seek"><span id="elapsed">0:00</span><input id="progress" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div></div><div class="volume"><i class="fa-solid fa-volume-high"></i><input id="volume" type="range" min="0" max="1" step=".01" value=".8"></div></footer>

<script>
const $=s=>document.querySelector(s),dbName='sonora-audio';let db,tracks=[],history=[],current=null,shuffle=false,repeat=0,page='home',objectURL=null,playRequest=0,activeHistory=null,lastTick=null,lastPosition=null;const audio=new Audio();
const openDB=()=>new Promise((ok,no)=>{let r=indexedDB.open(dbName,1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const put=record=>new Promise(ok=>{let t=db.transaction('files','readwrite');t.objectStore('files').put(record);t.oncomplete=ok});
const get=id=>new Promise(ok=>{let r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>ok(r.result)});
const save=()=>localStorage.setItem('sonora-meta',JSON.stringify({tracks:tracks.map(({blob,...s})=>s),history}));
const load=()=>{let x=JSON.parse(localStorage.getItem('sonora-meta')||'{}');tracks=x.tracks||[];history=x.history||[]};
const time=n=>isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{let t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)};
function art(s){return s?.art?'<img src="'+esc(s.art)+'" style="width:100%;height:100%;object-fit:cover">':'<i class="fa-solid fa-music"></i>'}
function row(s,i){return '<div class="track" data-id="'+s.id+'"><div>'+ (i+1)+'</div><div class="name"><div class="art">'+art(s)+'</div><div><b>'+esc(s.title)+'</b><small>'+esc(s.artist||'Unknown artist')+'</small></div></div><button data-fav="'+s.id+'">'+(s.fav?'<i class="fa-solid fa-heart"></i>':'<i class="fa-regular fa-heart"></i>')+'</button></div>'}
function card(s){return '<div class="card" data-id="'+s.id+'"><div class="art">'+art(s)+'</div><b>'+esc(s.title)+'</b><small>'+esc(s.artist||'Unknown artist')+'</small></div>'}
function list(arr){return arr.length?'<div class="table">'+arr.map(row).join('')+'</div>':'<div class="empty">No music here yet. Add audio files to start your collection.</div>'}
function render(){let c=$('#content');if(page==='home'){let rec=history.slice(0,5).map(h=>tracks.find(s=>s.id===h.id)).filter(Boolean);c.innerHTML='<section class="hero"><div class="eyebrow">PERSONAL MUSIC SPACE</div><h1>Your music.<br>Your world.</h1><p>Every song you love, all in one place.</p><button class="pill" id="heroUpload">＋ Add music to your library</button></section><h2>Recently played</h2>'+list(rec)+'<h2>Recently added</h2><div class="cards">'+tracks.slice(0,6).map(card).join('')+'</div>'}else if(page==='library'){c.innerHTML='<div class="eyebrow">COLLECTION</div><h1>Your Library</h1><p class="muted">'+tracks.length+' songs</p>'+list(tracks)}else if(page==='search'){c.innerHTML='<h1>Search</h1><input class="search" id="search" placeholder="Songs, artists, albums..."><div id="results"></div>';$('#search').oninput=e=>{let q=e.target.value.toLowerCase();$('#results').innerHTML=list(tracks.filter(s=>(s.title+' '+s.artist+' '+s.album).toLowerCase().includes(q)));bind()}}else if(page==='artists'){let a=[...new Set(tracks.map(s=>s.artist).filter(Boolean))];c.innerHTML='<h1>Artists</h1><div class="cards">'+a.map(n=>'<div class="card" data-artist="'+esc(n)+'"><div class="art">♬</div><b>'+esc(n)+'</b><small>'+tracks.filter(s=>s.artist===n).length+' tracks</small></div>').join('')+'</div>'}else{let mins=history.reduce((n,h)=>n+(Number.isFinite(h.seconds)&&h.seconds>0?h.seconds:0),0);let plays={};history.forEach(h=>plays[h.id]=(plays[h.id]||0)+1);let top=Object.entries(plays).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id])=>tracks.find(s=>s.id===id)).filter(Boolean);c.innerHTML='<div class="eyebrow">YOUR LISTENING</div><h1>Wrapped & Stats</h1><div class="stats"><div class="stat"><small>Hours listened</small><strong>'+Math.round(mins/60*10)/10+' hrs</strong></div><div class="stat"><small>Playback sessions</small><strong>'+history.length+'</strong></div><div class="stat"><small>Library</small><strong>'+tracks.length+' songs</strong></div></div><h2>Top tracks</h2>'+list(top)}bind()}
function bind(){document.querySelectorAll('[data-id]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-fav]'))return;play(el.dataset.id)});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();let s=tracks.find(x=>x.id===b.dataset.fav);s.fav=!s.fav;save();render()});document.querySelectorAll('[data-artist]').forEach(el=>el.onclick=()=>{page='library';render();let a=el.dataset.artist;$('#content').innerHTML='<h1>'+esc(a)+'</h1>'+list(tracks.filter(s=>s.artist===a));bind()});$('#heroUpload')?.addEventListener('click',upload)}
function upload(){$('#files').click()}
$('#upload').onclick=upload;$('#sideUpload').onclick=upload;$('#files').onchange=async e=>{for(const f of e.target.files){if(!f.type.startsWith('audio/'))continue;let s={id:crypto.randomUUID(),title:f.name.replace(/\.[^.]+$/,''),artist:'',album:'',fileName:f.name,added:Date.now(),fav:false};await put({...s,blob:f});tracks.unshift(s)}save();render();toast('Music added to this browser')};
async function play(id){const request=++playRequest;let s=tracks.find(x=>x.id===id);if(!s)return;try{let record=await get(id);if(request!==playRequest)return;if(!record?.blob){toast('Audio file unavailable');return}audio.pause();flushListening();activeHistory=null;lastTick=null;lastPosition=null;if(objectURL)URL.revokeObjectURL(objectURL);current=s;objectURL=URL.createObjectURL(record.blob);audio.src=objectURL;update();await audio.play();if(request!==playRequest)return;render()}catch(error){if(request===playRequest)toast('Unable to play this track')}}
function update(){$('#nowTitle').textContent=current?.title||'Nothing playing';$('#nowArtist').textContent=current?.artist||'Choose a song to begin';$('#nowArt').innerHTML=art(current);$('#play').innerHTML=audio.paused?'<i class="fa-solid fa-play"></i>':'<i class="fa-solid fa-pause"></i>'}
function next(automatic=false){if(!tracks.length)return;let i=tracks.findIndex(s=>s.id===current?.id);if(shuffle&&tracks.length>1){let choices=tracks.filter(t=>t.id!==current?.id);return play(choices[Math.floor(Math.random()*choices.length)].id)}if(automatic&&!repeat&&i===tracks.length-1)return;return play(tracks[(i+1)%tracks.length].id)}
function previous(){if(!tracks.length)return;if(audio.currentTime>3){audio.currentTime=0;return}let i=tracks.findIndex(s=>s.id===current?.id);return play(tracks[i<0?0:(i-1+tracks.length)%tracks.length].id)}
function flushListening(){if(activeHistory)save()}
function resetListeningClock(){lastTick=null;lastPosition=null}
function sampleListening(){const now=performance.now(),position=audio.currentTime;if(activeHistory&&lastTick!==null&&!audio.seeking){const elapsed=(now-lastTick)/1000,advanced=position-lastPosition;if(elapsed>0&&advanced>0&&advanced<=elapsed*audio.playbackRate+0.5){activeHistory.seconds+=Math.min(elapsed,advanced/audio.playbackRate);if(Math.floor(activeHistory.seconds/5)>Math.floor((activeHistory.seconds-Math.min(elapsed,advanced/audio.playbackRate))/5))save()}}lastTick=now;lastPosition=position}

audio.onplay=update;audio.onplaying=()=>{if(!activeHistory&&current){activeHistory={id:current.id,at:Date.now(),seconds:0};history.unshift(activeHistory);save()}lastTick=performance.now();lastPosition=audio.currentTime;update()};audio.onpause=()=>{sampleListening();flushListening();resetListeningClock();update()};audio.onwaiting=()=>{sampleListening();flushListening();resetListeningClock()};audio.onseeking=resetListeningClock;audio.onseeked=()=>{if(!audio.paused){lastTick=performance.now();lastPosition=audio.currentTime}};audio.onended=()=>{sampleListening();flushListening();resetListeningClock();activeHistory=null;if(repeat===2){audio.currentTime=0;audio.play().catch(()=>toast('Unable to repeat track'))}else next(true)};audio.ontimeupdate=()=>{$('#elapsed').textContent=time(audio.currentTime);$('#duration').textContent=time(audio.duration);if(audio.duration)$('#progress').value=audio.currentTime/audio.duration*1000;if(!audio.paused&&!audio.seeking&&lastTick!==null)sampleListening()};window.addEventListener('pagehide',flushListening);document.addEventListener('visibilitychange',()=>{if(document.hidden)flushListening()});audio.onerror=()=>{flushListening();resetListeningClock();toast('Audio playback failed');update()};
$('#play').onclick=()=>current?(audio.paused?audio.play().catch(()=>toast('Unable to resume playback')):audio.pause()):tracks.length&&play(tracks[0].id);$('#next').onclick=()=>next();$('#prev').onclick=previous;$('#shuffle').onclick=()=>{shuffle=!shuffle;$('#shuffle').style.color=shuffle?'var(--accent)':''};$('#repeat').onclick=()=>{repeat=(repeat+1)%3;$('#repeat').style.color=repeat?'var(--accent)':'';$('#repeat').innerHTML=repeat===2?'<i class="fa-solid fa-repeat"></i><sup>1</sup>':'<i class="fa-solid fa-repeat"></i>'};$('#progress').oninput=()=>audio.duration&&(audio.currentTime=audio.duration*$('#progress').value/1000);$('#volume').oninput=()=>audio.volume=$('#volume').value;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x===b));render()});
(async()=>{db=await openDB();load();audio.volume=.8;render()})();

// SONORA Stage 2: library management
let playlists=JSON.parse(localStorage.getItem('sonora-playlists')||'[]');
let librarySort='recent', libraryFilter='all', activePlaylist=null;
function persistPlaylists(){localStorage.setItem('sonora-playlists',JSON.stringify(playlists))}
function albumKey(t){return (t.album||'Singles')+' — '+(t.artist||'Unknown artist')}
function albums(){let map={};tracks.forEach(t=>{let k=albumKey(t);(map[k]||(map[k]=[])).push(t)});return Object.entries(map)}
function stageRow(t,i){return '<div class="track" data-id="'+t.id+'"><div>'+ (i+1)+'</div><div class="name"><div class="art">'+art(t)+'</div><div><b>'+esc(t.title)+'</b><small>'+esc(t.artist||'Unknown artist')+' · '+esc(t.album||'Unknown album')+'</small></div></div><div class="track-actions"><button title="Favourite" data-fav="'+t.id+'">'+(t.fav?'<i class="fa-solid fa-heart"></i>':'<i class="fa-regular fa-heart"></i>')+'</button><button title="Add to playlist" aria-label="Add to playlist" data-add-playlist="'+t.id+'"><i class="fa-solid fa-list-ul"></i></button><button title="Edit details" aria-label="Edit details" data-edit="'+t.id+'"><i class="fa-solid fa-pen"></i></button></div></div>'}
function stageList(arr){return arr.length?'<div class="table">'+arr.map(stageRow).join('')+'</div>':'<div class="empty">Nothing here yet. Add music or create a playlist.</div>'}
function stageBind(){
 document.querySelectorAll('.track[data-id]').forEach(el=>el.onclick=e=>{if(e.target.closest('button'))return;play(el.dataset.id)});
 document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();let t=tracks.find(x=>x.id===b.dataset.fav);if(t){t.fav=!t.fav;save();render()}});
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation();editTrack(b.dataset.edit)});
 document.querySelectorAll('[data-add-playlist]').forEach(b=>b.onclick=e=>{e.stopPropagation();addToPlaylist(b.dataset.addPlaylist)});
 document.querySelectorAll('[data-album]').forEach(el=>el.onclick=()=>{let k=el.dataset.album;page='album-detail';activePlaylist=k;render()});
 document.querySelectorAll('[data-playlist]').forEach(el=>el.onclick=()=>{page='playlist-detail';activePlaylist=el.dataset.playlist;render()});
 document.querySelectorAll('[data-artist]').forEach(el=>el.onclick=()=>{page='artist-detail';activePlaylist=el.dataset.artist;render()});
 $('#heroUpload')?.addEventListener('click',upload);$('#create-playlist')?.addEventListener('click',createPlaylist);
 $('#lib-search')?.addEventListener('input',()=>{const input=$('#lib-search'),v=input.value,pos=input.selectionStart;render();const next=$('#lib-search');if(next){next.focus();next.setSelectionRange(pos,pos)}});
 $('#lib-sort')?.addEventListener('change',e=>{librarySort=e.target.value;render()});
 document.querySelectorAll('[data-lib-filter]').forEach(b=>b.onclick=()=>{libraryFilter=b.dataset.libFilter;render()});
}
function editTrack(id){let t=tracks.find(x=>x.id===id);if(!t)return;const modal=document.createElement('div');modal.className='modal';modal.innerHTML='<div class="box"><h2>Edit track</h2><label>Title</label><input id="edit-title" value="'+esc(t.title)+'"><label>Artist</label><input id="edit-artist" value="'+esc(t.artist)+'"><label>Album</label><input id="edit-album" value="'+esc(t.album)+'"><label>Artwork image URL (optional)</label><input id="edit-art" value="'+esc(t.art||'')+'"><div class="row"><button id="save-track">Save</button><button class="btn-secondary" id="cancel-track">Cancel</button></div></div>';document.body.append(modal);$('#cancel-track').onclick=()=>modal.remove();$('#save-track').onclick=()=>{t.title=$('#edit-title').value.trim()||t.title;t.artist=$('#edit-artist').value.trim();t.album=$('#edit-album').value.trim();t.art=$('#edit-art').value.trim();save();modal.remove();render();toast('Track details saved')}}
function createPlaylist(){let name=prompt('Playlist name?');if(!name?.trim())return;playlists.push({id:crypto.randomUUID(),name:name.trim(),trackIds:[],created:Date.now()});persistPlaylists();render();toast('Playlist created')}
function addToPlaylist(id){if(!playlists.length){createPlaylist();if(!playlists.length)return}let choices=playlists.map((p,i)=>(i+1)+'. '+p.name).join('\n');let n=Number(prompt('Add to which playlist?\n'+choices));let p=playlists[n-1];if(p){if(!p.trackIds.includes(id))p.trackIds.push(id);persistPlaylists();toast('Added to '+p.name)}}
function stageRender(){
 let c=$('#content'), tracksSorted=[...tracks].sort((a,b)=>librarySort==='title'?a.title.localeCompare(b.title):librarySort==='artist'?a.artist.localeCompare(b.artist):librarySort==='oldest'?a.added-b.added:b.added-a.added);
 if(page==='library'){
  let q=$('#lib-search')?.value?.toLowerCase()||'',arr=tracksSorted.filter(t=>(t.title+' '+t.artist+' '+t.album).toLowerCase().includes(q));
  if(libraryFilter==='favourites')arr=arr.filter(t=>t.fav);
  c.innerHTML='<div class="eyebrow">COLLECTION</div><h1>Your Library</h1><p class="muted">'+tracks.length+' tracks · '+albums().length+' albums</p><div class="library-tools"><input id="lib-search" placeholder="Filter your library" value="'+esc(q)+'"><select id="lib-sort"><option value="recent">Recently added</option><option value="title">Title A–Z</option><option value="artist">Artist A–Z</option><option value="oldest">Oldest added</option></select><button class="chip '+(libraryFilter==='all'?'active':'')+'" data-lib-filter="all">All tracks</button><button class="chip '+(libraryFilter==='favourites'?'active':'')+'" data-lib-filter="favourites">♥ Favourites</button></div>'+stageList(arr)
 }else if(page==='albums'){
  c.innerHTML='<div class="eyebrow">COLLECTION</div><h1>Albums</h1><p class="muted">'+albums().length+' albums</p><div class="cards">'+albums().map(([k,a])=>'<div class="card album-card" data-album="'+esc(k)+'"><div class="art">'+(a[0].art?art(a[0]):'▣')+'</div><b>'+esc(a[0].album||'Singles')+'</b><small>'+esc(a[0].artist||'Unknown artist')+' · '+a.length+' tracks</small></div>').join('')+'</div>'
 }else if(page==='playlists'){
  c.innerHTML='<div class="row" style="justify-content:space-between"><div><div class="eyebrow">YOUR COLLECTION</div><h1>Playlists</h1></div><button class="pill" id="create-playlist">＋ New playlist</button></div><div class="cards">'+playlists.map(p=>'<div class="card playlist-card" data-playlist="'+p.id+'"><div class="art">☷</div><b>'+esc(p.name)+'</b><small>'+p.trackIds.length+' tracks</small></div>').join('')+'</div>'+(!playlists.length?'<div class="empty">Create your first playlist to organise your music.</div>':'')
 }else if(page==='favourites'){let fav=tracks.filter(t=>t.fav);c.innerHTML='<div class="eyebrow">YOUR COLLECTION</div><h1>Favourites ♥</h1><p class="muted">'+fav.length+' tracks</p>'+stageList(fav)
 }else if(page==='album-detail'){let a=albums().find(([k])=>k===activePlaylist)?.[1]||[];c.innerHTML='<button class="chip" data-back>← Albums</button><h1>'+esc(a[0]?.album||'Album')+'</h1><p class="muted">'+esc(a[0]?.artist||'Unknown artist')+' · '+a.length+' tracks</p>'+stageList(a);document.querySelector('[data-back]').onclick=()=>{page='albums';render()}
 }else if(page==='playlist-detail'){let p=playlists.find(x=>x.id===activePlaylist),arr=(p?.trackIds||[]).map(id=>tracks.find(t=>t.id===id)).filter(Boolean);c.innerHTML='<button class="chip" data-back>← Playlists</button><div class="row" style="justify-content:space-between"><h1>'+esc(p?.name||'Playlist')+'</h1><button class="chip" id="rename-playlist">Rename</button></div><p class="muted">'+arr.length+' tracks</p>'+stageList(arr);document.querySelector('[data-back]').onclick=()=>{page='playlists';render()};$('#rename-playlist').onclick=()=>{let n=prompt('Playlist name',p.name);if(n?.trim()){p.name=n.trim();persistPlaylists();render()}}
 }else if(page==='artist-detail'){let arr=tracks.filter(t=>t.artist===activePlaylist);c.innerHTML='<button class="chip" data-back>← Artists</button><h1>'+esc(activePlaylist)+'</h1><p class="muted">'+arr.length+' tracks · '+new Set(arr.map(t=>t.album)).size+' albums</p>'+stageList(arr);document.querySelector('[data-back]').onclick=()=>{page='artists';render()}
 }else if(page==='search'){c.innerHTML='<h1>Search</h1><input class="search" id="search" placeholder="Songs, artists, albums, playlists..."><div id="results"></div>';$('#search').oninput=e=>{let q=e.target.value.toLowerCase();let matches=tracks.filter(t=>(t.title+' '+t.artist+' '+t.album).toLowerCase().includes(q));$('#results').innerHTML=stageList(matches);stageBind()}}
 else {return false}
 stageBind();return true
}
const oldRender=render;render=function(){if(['library','albums','playlists','favourites','album-detail','playlist-detail','artist-detail'].includes(page)){stageRender();return}oldRender();stageBind()};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x===b));render()});
</script></body></html>
